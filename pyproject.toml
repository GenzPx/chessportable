[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chessportable"
version = "3.0.0"
description = "ChessPortable v3.0 by GenzPX - Pure-Python CLI chess for Termux with 20 Bots, Living Dialogues, Eval Momentum Graph, Per-Bot Adaptive (A 0-19), ARC auto-sequence, 135+ Openings, Coach & Puzzles"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "GenzPX"}]
license = {text = "MIT"}
keywords = ["chess", "cli", "termux", "python", "terminal", "genzpx"]

[project.urls]
Homepage = "https://github.com/GenzPx/chessportable"
Repository = "https://github.com/GenzPx/chessportable"

[project.scripts]
chessportable = "chessportable.cli:main"

[tool.setuptools.packages.find]
include = ["chessportable*"]
